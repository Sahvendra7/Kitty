<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty demo stage</title>
<link rel="stylesheet" href="/ui/kitty.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:#14282C;color:#E4F3EF;font:400 13px/1.3 var(--font);display:grid;grid-template-rows:1fr auto;padding:10px 10px 6px;gap:6px}
.row{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr)) minmax(430px,1.7fr);gap:10px;min-height:0}
iframe{width:100%;height:100%;border:0;border-radius:14px;background:#fff}
p{text-align:center;opacity:.8}
@media (max-width:1100px){body{height:auto}.row{grid-template-columns:1fr;}iframe{height:640px}}
</style>
</head>
<body>
<div class="row">
  <iframe title="Priya's app" src="http://127.0.0.1:7101/"></iframe>
  <iframe title="Arjun's app" src="http://127.0.0.1:7102/"></iframe>
  <iframe title="Meera's app" src="http://127.0.0.1:7103/"></iframe>
  <iframe title="The trip board" src="http://127.0.0.1:7100/"></iframe>
</div>
<p>Synthetic data, on one laptop, shown side by side for this demo. Each app is a separate process holding one person's login. Each statement reaches the model provider after stripping. Whoever hosts Switch can read private rooms.</p>
</body>
</html>
