<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty</title>
<link rel="stylesheet" href="/ui/kitty.css">
<style>
/* Room colours are the point of this page: dark for just you, pale for your desk, marigold for the group. */
html,body{height:100%}
body{font-size:16.500px;line-height:1.45;color:var(--ink);background:var(--monsoon);display:flex;flex-direction:column;overflow:hidden}
.rail{display:contents}
header{order:0}.who{order:1}.error{order:2}main{order:3}#form{order:4}nav{order:5}
header{padding:8px 14px 8px 18px;display:flex;align-items:center;gap:12px;color:var(--on-dark);background:var(--monsoon)}
.who-am-i{flex:1;min-width:0}
header h1{font-size:23px;line-height:1.1;font-weight:750;overflow-wrap:anywhere;letter-spacing:-.01em}
header span{font-size:14.500px;opacity:.8;display:block;overflow-wrap:anywhere;line-height:1.25}
#catdock .kc-btn kitty-cat{width:50px;height:50px}
#catdock .kc-show{background:rgba(255,255,255,.14);color:#fff}
.kc .kc-floor{opacity:.2}

/* Who can see this: the one line that is always true, and always visible. */
.who{padding:7px 18px;font-size:14.500px;line-height:1.3;font-weight:500;display:flex;gap:8px;align-items:center}
.who svg{flex:none}
main{flex:1;overflow-y:auto;padding:16px 14px 20px;min-height:0}
main:focus{outline:0}
.booting{color:var(--on-monsoon)}
body[data-tab=private] .who,body[data-tab=statement] .who{background:var(--monsoon-2);color:var(--on-monsoon)}
body[data-tab=private] main,body[data-tab=statement] main{background:var(--monsoon)}
body[data-tab=desk] .who{background:var(--glass-2);color:var(--ink)} body[data-tab=desk] main{background:var(--glass);color:var(--ink)}
body[data-tab=group] .who{background:var(--marigold);color:var(--on-accent)} body[data-tab=group] main{background:var(--marigold-wash);color:var(--ink)}

/* Just you */
.bubble{max-width:86%;padding:9px 13px;margin:0 0 8px;border-radius:4px 14px 14px 14px;background:var(--monsoon-2);color:#fff;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{margin-left:auto;background:var(--glass);color:var(--ink);border-radius:14px 4px 14px 14px}
.bubble code{font-weight:600;font-size:14.500px;background:rgba(255,255,255,.16);padding:0 5px;border-radius:4px}
.bubble.mine code{background:rgba(0,0,0,.08)}
.asks{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.ask{border:0;border-radius:999px;min-height:40px;padding:7px 15px;background:var(--marigold);color:var(--on-accent);font-weight:600;cursor:pointer;transition:background .14s}
.ask:hover{background:var(--marigold-hover)}
.ask.quiet{background:transparent;color:var(--on-monsoon);box-shadow:inset 0 0 0 1.5px var(--on-monsoon)}
.ask.quiet:hover{background:rgba(255,255,255,.1)}
.ask.danger{background:#C2185B;color:#fff}
.ask[aria-pressed=true]{background:var(--glass);color:var(--ink);box-shadow:none}
.lede{color:var(--on-monsoon);margin-bottom:12px}
#form{display:flex;gap:8px;padding:10px 12px;background:var(--monsoon-2)}
#form input{flex:1;min-width:0;margin:0;border:0;border-radius:999px;padding:9px 16px;background:var(--surface);min-height:44px}
#form button{border:0;border-radius:999px;padding:9px 18px;background:var(--marigold);color:var(--on-accent);font-weight:600;cursor:pointer}

/* Your desk */
.desk{display:grid;gap:18px;align-items:start}
.desk.side-first .side{order:-1}
.queue{display:grid;gap:14px;min-width:0}
.side{min-width:0;display:grid;gap:14px}
.queue-head{display:flex;align-items:center;gap:10px}
.queue-head kitty-cat{width:64px;height:64px}
.queue-head h2{font-size:22px}
.queue-head p{font-size:15px;color:var(--ink-2);line-height:1.3}
.queue-head>div{flex:1;min-width:0}
.queue-count{flex:none;min-width:38px;height:38px;padding:0 10px;display:grid;place-items:center;border-radius:999px;background:var(--monsoon);color:var(--on-dark);font-weight:700;font-size:19px}
.past-head{font-size:18px;margin-top:6px}
.chit{padding:16px 16px 14px;margin:7px 0 0}
.chit-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.chit .amt{font-size:29px;font-weight:750;font-stretch:110%;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;overflow-wrap:anywhere}
.chit .amt.word{font-size:24px;font-stretch:108%}
.chit .what{color:var(--ink-2);margin:3px 0 10px;overflow-wrap:anywhere}
.chit ul{list-style:none;padding:0;margin:0 0 12px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15.500px}
.chit li{display:contents}
.chit li span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.chit .acts,.sheet .acts{display:flex;gap:8px;flex-wrap:wrap}
.chit .state{font-weight:600;color:var(--ink-2);font-size:15px;margin-top:6px}
.chit.done{box-shadow:none;background:var(--surface);opacity:.92}
.chit.alert{box-shadow:var(--lift),inset 4px 0 0 var(--bad)}
.chit.alert .state{color:var(--bad)}
.chit.alert.soft{box-shadow:var(--lift),inset 4px 0 0 var(--marigold)}
.chit.alert.soft .state{color:var(--wait)}
.chit.dropping{animation:drop .55s cubic-bezier(.4,0,.8,.3) forwards}
@keyframes drop{to{transform:translateY(-180px) rotate(-6deg) scale(.6);opacity:0}}
.btn{min-height:42px;padding:8px 15px;border-radius:10px}
details{margin-top:12px;color:var(--ink-2);font-size:15px}
summary{cursor:pointer;font-weight:600;min-height:28px}
summary:hover{color:var(--ink)}
details .acts{margin-top:8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.4 ui-monospace,Menlo,monospace;background:var(--sunk);color:var(--ink);padding:8px;margin-top:6px;border-radius:6px}
.notice{background:var(--surface);color:var(--ink);box-shadow:inset 4px 0 0 var(--bad);border-radius:var(--r-s);padding:9px 12px;font-size:15px}
.empty-state{display:flex;align-items:center;gap:12px;padding:10px 4px;color:var(--ink-2)}
.empty-state kitty-cat{width:72px;height:72px}

/* A payment under review: what they say, what your statement shows, and how far apart those are. */
.compare{display:grid;gap:0;margin:0 0 12px;border-top:1.5px dashed var(--rule-strong)}
.compare div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:0 10px;padding:7px 0;border-bottom:1.5px dashed var(--rule-strong);align-items:baseline}
.compare dt{font-size:14.500px;color:var(--ink-2)}
.compare dd{margin:0;font-size:15.500px;line-height:1.35;overflow-wrap:anywhere}
.compare dd .pill{margin:0 6px 3px 0;vertical-align:baseline}
.pill.maybe{box-shadow:none;outline:0;background:none;border:1.5px dashed var(--ink-2);padding:0 9px}
.pill.nofind{background:var(--sunk)}
.chit.review-open{box-shadow:var(--lift),inset 4px 0 0 var(--marigold)}

/* A member's claim: three steps, and who has to take the next one. */
.claim-steps{list-style:none;padding:0;margin:0 0 12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));font-size:14.500px;line-height:1.2;color:var(--ink-2)}
.chit .claim-steps li{display:block;position:relative;padding-top:18px;font-weight:600}
.claim-steps li::before{content:"";position:absolute;left:0;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--rule-strong);z-index:1}
.claim-steps li::after{content:"";position:absolute;left:0;right:0;top:10px;height:2px;background:var(--rule-strong)}
.claim-steps li:last-child::after{display:none}
.claim-steps li[data-at=done]{color:var(--ink)}
.claim-steps li[data-at=done]::before{background:var(--good);box-shadow:none}
.claim-steps li[data-at=done]::after{background:var(--good)}
.claim-steps li[data-at=now]{color:var(--ink)}
.claim-steps li[data-at=now]::before{background:var(--marigold);box-shadow:0 0 0 3px var(--marigold-wash)}
.claim-steps li[data-at=stopped]{color:var(--bad)}
.claim-steps li[data-at=stopped]::before{background:var(--bad);box-shadow:none}

/* The pot, in figures */
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;margin:10px 0 8px}
.figs span{display:block;font-size:14px;color:var(--ink-2);line-height:1.2}
.figs b{display:block;font-size:clamp(17px,2.200vw,22px);font-weight:750;font-variant-numeric:tabular-nums;font-stretch:104%;overflow-wrap:anywhere;line-height:1.2}
.figs .good b{color:var(--good)}
.chit .roll{margin:10px 0 0}
.chit .roll li span:first-child{overflow-wrap:anywhere;font-weight:550}
.form-title{display:flex;align-items:center;gap:8px;font-size:18px;margin-top:16px;padding-top:12px;border-top:1.5px dashed var(--rule-strong)}
.form-title kitty-cat{width:44px;height:44px}

/* The group */
.feed{max-width:none}
.line{display:grid;grid-template-columns:1fr auto;gap:0 12px;padding:10px 0;border-bottom:1.5px solid var(--rule)}
.line b{font-size:17.500px;font-weight:650;line-height:1.25;overflow-wrap:anywhere}
.line b:nth-child(2){font-variant-numeric:tabular-nums}
.line small{grid-column:1/-1;color:var(--ink-2);font-size:14.500px;overflow-wrap:anywhere}
.note{padding:10px 0;border-bottom:1.5px solid var(--rule);overflow-wrap:anywhere}
.note.mine{color:var(--ink-2);font-size:14.500px}
.note.big{font-size:23px;font-weight:750;font-stretch:108%;line-height:1.2;border:0;padding:14px 0}
.note.bad{color:var(--bad);font-weight:600}
.note table{width:100%;border-collapse:collapse;margin-top:2px}.note td{padding:2px 0}.note td:nth-child(n+2),.note th:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums;padding-left:10px;white-space:nowrap}.note td:nth-child(n+2){font-weight:600}.note th{text-align:left;font-weight:500;font-size:14px;color:var(--ink-2);padding-bottom:2px}
.quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick .btn.no{background:var(--surface)}

/* Your statement */
.sheet{background:var(--surface);color:var(--ink);padding:18px 16px;margin:0 0 14px;border-radius:var(--r-m)}
.sheet h2{font-size:24px;line-height:1.15}
.sheet p{margin-top:6px}
.drop{display:block;margin-top:14px;padding:24px 14px;text-align:center;border:2px dashed var(--ink-2);border-radius:var(--r-m);cursor:pointer;background:var(--glass);font-weight:600;position:relative;transition:background .14s}
.drop:hover{background:var(--glass-2)}
.drop.over{background:var(--marigold-wash);border-color:var(--marigold)}
.drop small{display:block;font-weight:400;color:var(--ink-2)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:3px solid var(--monsoon-3);outline-offset:2px}
.attest{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-weight:500}
.attest input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--monsoon-2)}
.problems{margin-top:12px;padding:10px 12px;background:var(--bad-wash);box-shadow:inset 4px 0 0 var(--bad);border-radius:var(--r-s);font-size:15px}
.problems b{display:block}
.problems ul{margin:4px 0 0;padding-left:18px}
.okline{margin-top:12px;padding:10px 12px;background:var(--good-wash);box-shadow:inset 4px 0 0 var(--good);border-radius:var(--r-s);font-weight:500}
.where{display:grid;grid-template-columns:1fr auto;gap:0 12px;margin-top:12px;font-size:16px}
.where h3{grid-column:1/-1;font-size:18px;line-height:1.2;margin-top:12px;padding-bottom:4px;border-bottom:1.5px solid var(--rule)}
.where span{padding:3px 0}.where span:nth-of-type(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.sheet .acts{margin-top:14px}
.sending{color:var(--ink-2);font-weight:600;font-size:15px}
.retry-note{color:var(--bad);font-weight:600;font-size:15px;margin-bottom:6px}
.preview{margin-top:12px;color:var(--ink-2);font-size:14.500px}
.preview summary{font-size:15px}

/* The rooms */
nav{display:grid;grid-template-columns:repeat(3,1fr);background:#0B2024}
nav.four{grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;color:var(--on-monsoon);padding:8px 2px 9px;cursor:pointer;font-weight:600;font-size:14.500px;line-height:1.15;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:54px;transition:background .14s}
nav button:hover:not([aria-current=page]){background:rgba(255,255,255,.07)}
nav button[aria-current=page]{color:#14282C}
nav button[data-t=private][aria-current=page],nav button[data-t=statement][aria-current=page]{background:#E4F3EF}
nav button[data-t=desk][aria-current=page]{background:#fff}
nav button[data-t=group][aria-current=page]{background:#F5A81C}
nav i{font-style:normal;position:absolute;top:4px;left:calc(50% + 8px);min-width:19px;padding:0 4px;border-radius:999px;background:var(--marigold);color:#14282C;font-size:13px;line-height:19px;text-align:center}
nav button[aria-current=page] i{background:#14282C;color:#fff}
.error{background:#B8124F;color:#fff;padding:8px 18px;font-size:14.500px}
form.pot-form{display:grid;grid-template-columns:1fr;gap:12px;padding:12px 0 0;margin:0}
form.pot-form label{display:grid;gap:2px;font-size:15px;color:var(--ink)}
form.pot-form .attest{display:flex;gap:8px;align-items:center}
form.pot-form .btn{justify-self:start}
form.pot-form .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:380px){nav button{font-size:13.500px}}

/* From a tablet up, the rooms move to a rail and there's room to work. */
@media (min-width:960px){
  body{display:grid;grid-template-columns:272px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;background:var(--monsoon)}
  .rail{display:flex;flex-direction:column;grid-column:1;grid-row:1/5;min-height:0;overflow-y:auto}
  header{flex-direction:column-reverse;align-items:flex-start;gap:6px;padding:22px 20px 14px}
  header h1{font-size:30px}
  #catdock .kc-btn kitty-cat{width:112px;height:112px}
  nav,nav.four{display:flex;flex-direction:column;gap:4px;background:var(--monsoon);padding:8px 12px}
  nav button{flex-direction:row;justify-content:flex-start;gap:12px;padding:12px 14px;font-size:16.500px;border-radius:var(--r-m);min-height:0}
  nav i{position:static;margin-left:auto}
  .who{grid-column:2;grid-row:1;padding:10px clamp(20px,3vw,40px);font-size:15.500px}
  .error{grid-column:2;grid-row:2}
  main{grid-column:2;grid-row:3;padding:24px clamp(20px,3vw,40px) 32px}
  #form{grid-column:2;grid-row:4;padding:12px clamp(20px,3vw,40px)}
  main>*{max-width:780px;margin-inline:auto}
  main>.desk{max-width:1160px;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:clamp(20px,3vw,36px)}
  main>.desk.side-first .side{order:0}
  .side{position:sticky;top:0}
  html.kp-open main>.desk{grid-template-columns:minmax(0,1fr)}
  html.kp-open .side{position:static}
}
@media (prefers-reduced-motion:reduce){.chit.dropping{animation:none;opacity:.4}main{scroll-behavior:auto}}
</style>
</head>
<body data-tab="private">
<a class="skip" href="#main">Skip to the page</a>
<div class="rail"><header><div class="who-am-i"><h1 id="name">Kitty</h1><span id="trip"></span></div><div id="catdock"></div></header>
<nav aria-label="Rooms" id="nav">
  <button data-t="statement" hidden>Statement</button>
  <button data-t="private">Just you</button>
  <button data-t="desk">Your desk<i id="count" hidden></i></button>
  <button data-t="group">The group</button>
</nav></div>
<div class="who" id="who"></div>
<div class="error" id="err" role="alert" hidden></div>
<main id="main" tabindex="-1"><p class="booting">Opening your rooms.</p></main>
<form id="form" autocomplete="off"><input id="input" aria-label="Message your agent" placeholder="Tell your agent"><button>Send</button></form>
<script src="/ui/icons.js"></script>
<script src="/ui/cat.js"></script>
<script src="/ui/companion.js"></script>
<script src="/ui/guide.js"></script>
<script>
const WHO={statement:"Only you can see this. Your friends and the clerk never get your file.",private:"Only you and your agent are here. The clerk can't get in.",desk:"You, your agent and the clerk. Nothing goes further until you release it.",group:"Everyone on the trip can see this."};
const $=id=>document.getElementById(id);
const {guide,companion}=Kitty;
const ROOM_ICON={statement:"file-text",private:"lock",desk:"inbox",group:"users"};
document.querySelectorAll("nav button").forEach(b=>b.insertAdjacentHTML("afterbegin",Kitty.icon(ROOM_ICON[b.dataset.t],20)));
companion.mount({dock:"#catdock"});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>");
let lastCount=0,tab="private",data=null,last="",picked=new Set(),dropping=null,tabChosen=false;
const SENT_PATIENCE=12000;let pressed={};
let up={busy:false,problems:[],total:0,note:"",attested:false},preview=null,previewOpen=false,replacing=false;
try{const t=sessionStorage.getItem("tab");if(t){tab=t;tabChosen=true}}catch(e){}

async function say(room,text){
  const r=await fetch("/api/say",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({room,text})});
  if(!r.ok){showError("Couldn't send that. Check that Mattermost is running, then try again.")}
  poll();
}
function showError(t){const e=$("err");e.textContent=t;e.hidden=!t}

/* The clerk's room text carries ids such as c7 and t1, because verify.py reads them. People don't need them. */
function plainPrivate(t){
  return t.replace(/ To correct it, say `withdraw t\d+ payment_failed` on your desk\. Only the words "payment failed" reach the group\./," Only the words \"payment failed\" reach the group.")
    .replace(/ To correct it, say `withdraw p\d+ payment_failed` on your desk\. Only the words "payment failed" reach the group\./," Only the words \"payment failed\" reach the group.")
    .replace(/I re-checked [tp]\d+, and/,"I re-checked that payment, and").replace(/The clerk asked me to re-check [tp]\d+\./,"The clerk asked me to re-check that payment.").replace(/ for p\d+\. Check your UPI app/," for that. Check your UPI app");
}
function plainGroup(t){
  t=t.replace(/ \[d\d+ [0-9a-f]{12}\]$/,"").replace(/^\*\*[pk]\d+\*\* /,"").replace(/^\*\*p\d+ confirmed received by (\w+):\*\*/,"**$1 confirmed it arrived:**")
    .replace(/^\*\*p\d+ needs clarification\.\*\*/,"**Needs clarifying.**").replace(/^\*\*p\d+ not received, says (\w+)\.\*\*/,"**Not received, says $1.**")
    .replace(/^\*\*p\d+ withdrawn by (\w+)\.\*\*/,"**Withdrawn by $1.**").replace(/^\*\*Correction of p\d+:\*\*/,"**Correction:**").replace(/^\*\*k\d+ cancelled by (\w+)\.\*\*/,"**$1 cancelled a request for money.**");
  return t.replace(/^\*\*t\d+ confirmed by both sides:\*\*/,"**Confirmed by both sides:**").replace(/^\*\*t\d+ NOT CONFIRMED:\*\*/,"**Not confirmed:**")
    .replace(/^\*\*t\d+ withdrawn by (\w+)\.\*\*/,"**Withdrawn by $1.**").replace(/^\*\*t\d+\*\* /,"")
    .replace(/^\*\*Possible conflict:\*\* c\d+ and c\d+ look/,"**Possible conflict:** two claims look")
    .replace(/^Conflict cleared: (\w+) withdrew c\d+\. \*\*c\d+\*\* now counts: /,"Conflict cleared: $1 withdrew theirs. The other one now counts: ");
}
function keptPrivate(msgs){
  const kept=new Set();
  for(const m of msgs){
    if(m.mine){const r=m.text.match(/^reopen (.+)$/i);if(r)kept.delete(r[1]);continue}
    const a=m.text.match(/Kept private: (.+?)\. The group won't hear about these\./);
    if(a) a[1].split(", ").forEach(k=>kept.add(k));
    const b=m.text.match(/^Got it\. (.+?) stays private\./);
    if(b) kept.add(b[1]);
  }
  return [...kept];
}
function potPrivate(d,msgs){
  /* On a Pot trip nobody needs a statement to say what they paid, or whether money arrived. */
  let html=msgs.map(m=>`<div class="bubble ${m.mine?"mine":""}">${inline(m.mine?m.text:plainPrivate(m.text))}</div>`).join("");
  const last=msgs[msgs.length-1],id=last&&!last.mine?(last.text.match(/`received (t\d+)`/)||[])[1]:null;
  if(id) html+=`<div class="asks"><button class="ask" data-say="private" data-text="received ${id}">Yes, it arrived</button><button class="ask quiet" data-say="private" data-text="not received ${id}">No</button></div>`;
  html+=`<p class="lede" style="margin-top:10px">You don't need a statement on this trip. Say what you paid on your desk, and ${esc(d.pot.treasurer)} confirms it arrived.</p><div class="asks"><button class="ask" data-go="desk">Open your desk</button><button class="ask quiet" data-go="statement">Add my statement</button></div>`;
  return html;
}
function privateView(d){
  const msgs=d.private;
  const st=d.statement;
  if(st&&st.state==="none"&&d.pot) return potPrivate(d,msgs);
  if(st&&st.state==="none") return (msgs.length?`<div class="bubble">${inline(msgs[msgs.length-1].text)}</div>`:"")+`<div class="asks"><button class="ask" data-go="statement">Add my statement</button></div>`;
  if(st&&st.state==="ready") return (d.pot&&d.pot.is_treasurer?`<p class="lede">Checking payments doesn't need this button. It sends your spending lines from the trip's dates to the model provider. You can skip it and file spending by hand on your desk.</p>`:"")+msgs.map(m=>`<div class="bubble ${m.mine?"mine":""}">${inline(m.text)}</div>`).join("")+`<div class="asks"><button class="ask" data-say="private" data-text="start">Go through my statement</button></div>`;
  if(!msgs.length) return `<p class="lede">Your agent hasn't said hello yet. Check that it's running.</p>`;
  let html="";
  for(const m of msgs) html+=`<div class="bubble ${m.mine?"mine":""}">${inline(m.mine?m.text:plainPrivate(m.text))}</div>`;
  const lastMsg=msgs[msgs.length-1];
  if(lastMsg.mine) return html;
  const t=lastMsg.text;
  if(/Say `start`/.test(t)){
    html+=`<div class="asks"><button class="ask" data-say="private" data-text="start">Go through my statement</button></div>`;
  } else if(/Was this shared with the group\?/.test(t)){

    if(picked.size) html+=`<button class="ask" data-share>Shared with ${[...picked].map(id=>esc(d.people.find(p=>p.id===id).name)).join(" and ")}</button>`;

  } else if(/Did it arrive\?/.test(t)){

  } else if(/failed and was reversed/.test(t)){
    const id=(t.match(/withdraw ([tp]\d+)/)||[])[1];
    const open=d.desk.slips.some(x=>x.id===id&&((x.kind==="transfer"&&x.state==="challenged")||(x.kind==="contribution"&&["rejected","submitted","needs_clarification"].includes(x.state))));
    if(id&&open) html+=`<div class="asks"><button class="ask danger" data-say="desk" data-text="withdraw ${id} payment_failed">Withdraw it: the payment failed</button></div>`;
    else html+=`<div class="asks"><button class="ask quiet" data-say="private" data-text="rescan">Check my statement again</button></div>`;
  } else if(/Check your desk|on your desk|Your desk has/.test(t)){
    html+=`<div class="asks"><button class="ask quiet" data-go="desk">Open your desk</button><button class="ask quiet" data-say="private" data-text="rescan">Check my statement again</button></div>`;
    const kept=keptPrivate(msgs);

  }
  return html;
}

/* Where a member's claim has got to. Nothing here decides anything: it reads the state the clerk reported. */
function claimSteps(s){

const CLAIM_PILL={waiting:["","Not released"],submitted:["wait","Not counted yet"],needs_clarification:["wait","Can't confirm yet"],confirmed:["good","Confirmed"],rejected:["bad","Not received"],withdrawn:["","Withdrawn"],dropped:["","Dropped"]};

function refShown(d,id){

  return null;

const CANDIDATE={"found it":["maybe","Possible match","Your agent found a line for this. It isn't counted until you confirm."],"a different amount":["nofind","Different amount","There's a line near this date, for another amount."],"nothing yet":["nofind","Nothing found","No line on your statement for this yet."],"not checked yet":["nofind","Not checked yet","Your agent hasn't reported on this yet."]};

function potChit(s){

    else state={submitted:`Waiting for ${esc(s.to)}. Not counted yet.`,needs_clarification:`${esc(s.to)} can't confirm this yet.${s.note?" "+esc(s.note):""}`,confirmed:`${esc(s.to)} confirmed it arrived.`,rejected:`${esc(s.to)} says it didn't arrive. It isn't counted.`,withdrawn:"Withdrawn.",dropped:"Dropped. The group never saw it."}[s.state]||"";

    else if(s.state==="confirmed"){state=s.basis==="word"?"Confirmed, on your word.":"Confirmed.";pill=["good",s.basis==="word"?"On your word":"Confirmed"];acts=`<details><summary>Correct this</summary><p class="what">The group will see the correction, and it changes who owes what.</p><div class="acts"><button class="btn warn" data-say="desk" data-text="correct ${id} reversed">It came back</button><button class="btn warn" data-say="desk" data-text="correct ${id} not_received">It never arrived</button><button class="btn warn" data-say="desk" data-text="correct ${id} mistaken">My mistake</button></div></details>`;cls+=" done"}

function chit(s){
  if(s.kind==="contribution"||s.kind==="pot_review") return potChit(s);
  const id=s.id;let head="",what="",rows="",acts="",state="",cls="chit";

  }else if(s.kind==="transfer"){
    head=s.amount;what=`You paid ${esc(s.to)} on ${esc(s.date)}.`;

  }

    if(at&&Date.now()-at<SENT_PATIENCE){

    }
  }else{
    state={released:s.kind==="transfer"?"Released. Waiting for the other side.":"Released to the group.",dropped:"Dropped. The group never saw it.",sent:"Answer sent.",kept:"Kept private.",confirmed:"Confirmed by both sides.",challenged:"Not confirmed. Your agent is re-checking privately.",withdrawn:"Withdrawn.",conflict:"Possible conflict with someone else's claim. It doesn't count until one of you drops theirs."}[s.state]||s.state;
    cls+=s.state==="challenged"||s.state==="conflict"?" alert":" done";
    if(s.state==="conflict") acts=`<div class="acts" style="margin-top:10px"><button class="btn warn" data-say="desk" data-text="drop ${id}">Drop mine</button></div>`;
    if(s.state==="challenged") acts=`<div class="acts" style="margin-top:10px"><button class="btn warn" data-say="desk" data-text="withdraw ${id} payment_failed">Withdraw: the payment failed</button></div>`;
  }
  if(dropping===id) cls+=" dropping";
  return `<article class="${cls}"><div class="amt">${esc(head)}</div><p class="what">${what}</p>${rows}${state?`<p class="state">${esc(state)}</p>`:""}${acts}</article>`;
}

/* A refusal from the clerk is a code when nothing plainer came with it. */
const REFUSED={reference_differs:"That line's UPI reference doesn't match the one they gave, so nothing was confirmed.",credit_already_used:"That line on your statement already backs another confirmed payment, so nothing was confirmed.",amount_differs:"The amount differs, so nothing was confirmed. Ask them to withdraw it and claim the right amount.",manual_only_when_nothing_found:"Confirm by hand is only for when your agent found nothing."};

function table(text){

      const big=f.clerk!==false&&/Everyone's square/.test(f.text),bad=f.clerk!==false&&/NOT CONFIRMED|Possible conflict/.test(f.text);
      const who=f.mine||f.from?"":"";
      const isHuman=f.clerk===undefined?!/^\*\*|^Kitty is open|^Suggested|^Nothing to settle|^Refused|^Conflict|^\d+ expenses|^No released/.test(f.text):!f.clerk;
      html+=`<div class="note ${big?"big":""} ${bad?"bad":""} ${isHuman?"mine":""}">${isHuman?`${esc(f.from)}: `:""}${inline(isHuman?f.text:plainGroup(f.text))}${who}</div>`;
    }
  }
  return html;
}

const DROPZONE=()=>`<label class="drop" id="drop"><input type="file" id="file" accept=".csv,text/csv">${up.busy?"Checking your file":"Choose your CSV file"}<small>or drop it here. Up to 256 KB.</small></label>
  <label class="attest"><input type="checkbox" id="attest" ${up.attested?"checked":""}><span>This is a made-up statement, not a real one.</span></label>
  ${up.problems.length?`<div class="problems" role="alert"><b>${up.total>1?`Kitty found ${up.total} things to fix.`:"Kitty couldn't use that file."} Nothing was saved.</b><ul>${up.problems.map(p=>`<li>${esc(p.message)}</li>`).join("")}</ul>${up.total>up.problems.length?`<p>And ${up.total-up.problems.length} more like these.</p>`:""}</div>`:""}`;
function statementView(d){
  const st=d.statement;
  const note=up.note?`<div class="okline" role="status">${esc(up.note)}</div>`:"";
  if(st.state==="none"){
    return `<div class="sheet"><h2>Add your statement for ${esc(d.trip)}</h2><p>Use a CSV file with made-up transactions. Kitty checks it right here, then keeps it in your own folder.</p>${DROPZONE()}
    <p style="margin-top:12px"><a href="/api/statement/sample">Download a made-up example</a>, with this trip's dates.</p>
    <details><summary>What the file needs</summary><pre>txn_date,txn_time,narration,ref,debit,credit,balance,account
2026-10-16,20:15,SOME RESTAURANT,C1001,1250.50,,,XXXXXX1234</pre><p>Each line has a debit or a credit. Dates look like 2026-10-16, and the account has to be masked. Your organiser sees that you added a statement, and nothing from it.</p></details></div>`;
  }
  const s=st.summary;
  const counts=`<div class="where">
    <h3>Stays on this laptop</h3>
    <span>Outside the trip dates</span><span>${s.outside_trip}</span>
    <span>Payments to friends</span><span>${s.payments_to_friends}</span>
    <span>Money coming in</span><span>${s.incoming}</span>
    <h3>Goes to the model provider, when you start</h3>
    <span>Spending during the trip, with long numbers masked</span><span>${s.spending}</span>
  </div>`;
  const pv=`<details class="preview" id="pv" ${previewOpen?"open":""}><summary>See exactly what the model provider would get</summary>${preview?`<pre>${esc(preview.map(l=>JSON.stringify(l)).join("\n")||"Nothing.")}</pre><p>Your first name and the trip's name go with these. Your replies to your agent's questions go too, if it needs help reading them. Balances, account numbers and references never go.</p>`:"<p>Loading.</p>"}</details>`;
  if(st.state==="ready"){
    return `<div class="sheet"><h2>Your file is ready</h2><p>${s.lines} lines read, and ${s.in_trip} of them are from the trip. Nothing has left your side yet.</p>${note}${counts}${pv}
    <div class="acts"><button class="btn go" data-say-start>Go through my statement</button></div></div>
    <div class="sheet"><h2 style="font-size:20px">Wrong file?</h2><p>Adding another file replaces this one.</p>${DROPZONE()}<p style="margin-top:12px"><button class="linkish" id="removeFile">Remove this file</button></p></div>`;
  }
  return `<div class="sheet"><h2>Your agent has this statement</h2><p>${s.lines} lines read, and ${s.in_trip} of them are from the trip.</p>${note}${counts}${pv}
    <div class="acts"><button class="btn no" data-say="private" data-text="rescan">Check for new lines</button></div></div>
    <div class="sheet"><h2 style="font-size:20px">Add later transactions</h2><p>Add a newer export that still has all these lines, and your agent keeps its place.</p>${DROPZONE()}</div>`;
}
async function uploadFile(file){
  up={...up,problems:[],total:0,note:""};
  if(!up.attested){up.problems=[{message:"Tick the box to confirm this is a made-up statement."}];up.total=1;render();return}
  up.busy=true;render();
  try{
    const r=await fetch("/api/statement",{method:"POST",headers:{"Content-Type":"text/csv","X-Filename":encodeURIComponent(file.name),"X-Kitty-Synthetic":"yes"},body:file});
    const j=await r.json();
    up.busy=false;
    if(r.ok){
      up.note=j.status==="duplicate"?j.message:j.status==="added_lines"?`Added ${j.added} new line${j.added===1?"":"s"}. Choose Check for new lines when you're ready.`:j.status==="replaced"?"Your new file replaced the old one.":"Your file passed every check.";
      up.attested=false;preview=null;await loadPreview();
    }else{up.problems=j.problems||[{message:j.error||"Kitty couldn't use that file."}];up.total=j.total||up.problems.length}
  }catch(e){up.busy=false;up.problems=[{message:"The file didn't reach Kitty. Check that this app is still running, then try again."}];up.total=1}
  last="";await poll();render();
}
async function loadPreview(){try{const r=await fetch("/api/statement/model-preview");if(r.ok)preview=(await r.json()).lines}catch(e){}}

function render(){
  if(!data) return;
  const d=data;
  $("name").textContent=d.me.name;$("trip").textContent=d.trip;document.title=`${d.me.name}: Kitty`;
  const inApp=!!d.in_app;
  document.querySelector('nav button[data-t=statement]').hidden=!inApp;
  $("nav").classList.toggle("four",inApp);
  if(inApp&&!tabChosen){tab=d.statement&&d.statement.state==="reviewing"?"private":"statement";tabChosen=true}
  document.body.dataset.tab=tab;$("who").innerHTML=Kitty.icon(ROOM_ICON[tab],16)+`<span>${esc(WHO[tab])}</span>`;
  $("form").hidden=tab!=="private"||(inApp&&d.statement.state!=="reviewing");
  document.querySelectorAll("nav button").forEach(b=>b.dataset.t===tab?b.setAttribute("aria-current","page"):b.removeAttribute("aria-current"));
  const waiting=d.desk.slips.filter(s=>s.state==="waiting").length;
  $("count").hidden=!waiting;$("count").textContent=waiting;
  const main=$("main");const nearEnd=main.scrollHeight-main.scrollTop-main.clientHeight<80;
  const keep=remember(main);
  main.innerHTML=tab==="statement"&&inApp?statementView(d):tab==="private"?privateView(d):tab==="desk"?deskView(d):groupView(d);
  keep();
  if(tab==="statement"&&inApp) wireStatement();
  if(tab==="private"&&(nearEnd||lastCount!==d.private.length)) main.scrollTop=main.scrollHeight;
  lastCount=d.private.length;
  companion.set(guide.person(d,tab,cash));
  moments(d);
}
/* A poll can redraw the page mid-sentence. This keeps your cursor where it was, and open sections open. */
function remember(main){
  const a=document.activeElement,inside=a&&main.contains(a)&&a!==main;
  const sel=!inside?null:a.name?`[name="${a.name}"]`:a.dataset.text?`[data-text="${a.dataset.text}"]`:a.dataset.release?`[data-release="${a.dataset.release}"]`:a.id?`#${a.id}`:null;
  const form=inside&&a.form?a.form.dataset.pot:null,at=inside&&a.selectionStart!=null?a.selectionStart:null;
  const open=[...main.querySelectorAll("details[open]>summary")].map(s=>s.textContent);
  return ()=>{
    main.querySelectorAll("details>summary").forEach(s=>{if(open.includes(s.textContent))s.parentElement.open=true});
    if(!sel)return;
    const next=main.querySelector((form?`form[data-pot="${form}"] `:"")+sel);
    if(next){next.focus({preventScroll:true});if(at!=null&&next.setSelectionRange)try{next.setSelectionRange(at,at)}catch(e){}}
  };
}
/* The cat reacts to changes that really happened between two polls, never to the first load. */
let lastSeen=null;
function moments(d){
  const slips=d.desk.slips.filter(s=>s.kind==="contribution"||s.kind==="pot_review");
  const now={confirmed:slips.filter(s=>s.state==="confirmed").map(s=>s.id),trouble:slips.filter(s=>["rejected","needs_clarification"].includes(s.state)&&s.kind==="contribution").map(s=>s.id),transfers:d.desk.slips.filter(s=>s.state==="confirmed"&&s.kind==="transfer").map(s=>s.id),square:d.group.some(f=>f.type==="note"&&f.clerk!==false&&/Everyone's square/.test(f.text))};
  if(lastSeen){
    if(now.square&&!lastSeen.square){companion.moment("celebrating",3400);Kitty.petals()}
    else if(now.confirmed.some(i=>!lastSeen.confirmed.includes(i))||now.transfers.some(i=>!lastSeen.transfers.includes(i)))companion.moment("paid",1800);
    else if(now.trouble.some(i=>!lastSeen.trouble.includes(i)))companion.moment("warning",2200);
  }
  lastSeen=now;
}
function wireStatement(){
  const file=$("file"),drop=$("drop"),att=$("attest"),pv=$("pv"),rm=$("removeFile");
  if(att) att.onchange=()=>{up.attested=att.checked;if(up.problems.length===1&&att.checked&&/Tick the box/.test(up.problems[0].message)){up.problems=[];up.total=0;render()}};
  if(file) file.onchange=()=>{if(file.files[0]) uploadFile(file.files[0])};
  if(drop){
    drop.ondragover=e=>{e.preventDefault();drop.classList.add("over")};
    drop.ondragleave=()=>drop.classList.remove("over");
    drop.ondrop=e=>{e.preventDefault();drop.classList.remove("over");if(e.dataTransfer.files[0]) uploadFile(e.dataTransfer.files[0])};
  }
  if(pv) pv.ontoggle=async()=>{previewOpen=pv.open;if(pv.open&&!preview){await loadPreview();render()}};
  if(rm) rm.onclick=async()=>{await fetch("/api/statement",{method:"DELETE"});up.note="";preview=null;last="";poll()};
}
async function poll(){
  try{
    const r=await fetch("/api/feed");const j=await r.json();
    if(!r.ok){showError(j.error||"Something's wrong with this app.");return}
    showError("");
    const s=JSON.stringify(j);
    if(s!==last){last=s;data=j;render()}
  }catch(e){showError("This app isn't responding. Is run_all.py still going?")}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.t){tabChosen=true;tab=b.dataset.t;try{sessionStorage.setItem("tab",tab)}catch(_){}render();$("main").scrollTop=tab==="private"?1e6:0;return}
  if(b.dataset.go){tab=b.dataset.go;try{sessionStorage.setItem("tab",tab)}catch(_){}render();return}
  if(b.dataset.key){pressed[b.dataset.key]=Date.now();setTimeout(render,SENT_PATIENCE+100)}
  if("sayStart" in b.dataset){tab="private";try{sessionStorage.setItem("tab",tab)}catch(_){}say("private","start");render();return}
  if(b.dataset.say){if(b.dataset.say==="private"&&tab==="statement"){tab="private";try{sessionStorage.setItem("tab",tab)}catch(_){}}say(b.dataset.say,b.dataset.text);render();return}
  if(b.dataset.pick){picked.has(b.dataset.pick)?picked.delete(b.dataset.pick):picked.add(b.dataset.pick);render();return}
  if("share" in b.dataset){const list=[...picked].join(" ");picked.clear();say("private",`shared ${list}`);return}
  if(b.dataset.release){
    const id=b.dataset.release;dropping=id;render();
    const delay=matchMedia("(prefers-reduced-motion:reduce)").matches?0:500;
    setTimeout(()=>{dropping=null;say("desk",`release ${id}`)},delay);
  }
});
document.addEventListener("input",e=>{const f=e.target.closest("form[data-pot]");if(!f)return;potForm[e.target.name]=e.target.type==="checkbox"?e.target.checked:e.target.value});
document.addEventListener("change",e=>{const f=e.target.closest("form[data-pot]");if(!f)return;potForm[e.target.name]=e.target.type==="checkbox"?e.target.checked:e.target.value});
const potAmount=v=>{const t=String(v).trim().replace(/^(rs\.?|₹)\s*/i,"").replace(/,/g,"");return /^[0-9]+(\.[0-9]{1,2})?$/.test(t)&&Number(t)>0?t:null};
const inWindow=(d,lo,hi)=>d&&d>=lo&&d<=hi;
document.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-pot]");if(!f)return;e.preventDefault();
  const kind=f.dataset.pot,w=data.pot.window,problem=t=>{potProblem={[kind]:t};potNote="";render()};
  /* Checked here first, and what was typed stays until it's accepted. */
  if(kind==="call"){
    const a=potAmount(potForm.ask);if(!a)return problem("Say how much, like 5000.");
    say("desk",`call ${a} ${potForm.who.trim()}`.trim());potForm.ask="";potForm.who="";potNote="Asked. It's in the group room.";
  }else if(kind==="paid"){
    const a=potAmount(potForm.amount),ref=potForm.ref.trim();
    if(!a)return problem("Say how much you paid, like 5000.");
    if(!inWindow(potForm.day,w.from,w.to))return problem(`Choose a date from ${w.from} to ${w.to}.`);
    if(ref&&!/^[A-Za-z0-9]{4,16}$/.test(ref))return problem("A UPI reference is 4 to 16 letters and numbers.");
    say("private",`paid ${a} ${potForm.day}${ref?` ref ${ref}${potForm.show?" show":""}`:""}`);potForm={...potForm,amount:"",day:"",ref:"",show:false};potNote="Filed. It'll appear below for you to release.";
  }else if(kind==="spent"){
    const a=potAmount(potForm.sAmount);
    if(!a)return problem("Say how much you spent, like 3600.");
    if(!inWindow(potForm.sDay,w.spend_from,w.spend_to))return problem(`Spending has to be within the trip, ${w.spend_from} to ${w.spend_to}.`);
    say("private",`spent ${a} ${potForm.sDay} ${potForm.sCat}`);potForm={...potForm,sAmount:"",sDay:""};potNote="Filed. It'll appear below for you to release.";
  }else{
    const a=potAmount(potForm.rAmount),to=potForm.rTo||(f.querySelector("select")||{}).value;
    if(!a)return problem("Say how much you paid back, like 1000.");
    if(!inWindow(potForm.rDay,w.from,w.to))return problem(`Choose a date from ${w.from} to ${w.to}.`);
    say("private",`refund ${a} ${potForm.rDay} ${to}`);potForm={...potForm,rAmount:"",rDay:""};potNote="Filed. It'll appear below for you to release.";
  }
  potProblem={};render();
});
// The demo stage can change which tab is showing, and nothing else.
window.addEventListener("message",e=>{
  if(e.origin!=="http://127.0.0.1:7100"||!e.data||!["private","desk","group"].includes(e.data.kittyTab))return;
  tab=e.data.kittyTab;render();$("main").scrollTop=tab==="private"?$("main").scrollHeight:0;
});
$("form").addEventListener("submit",e=>{e.preventDefault();const v=$("input").value.trim();if(!v)return;$("input").value="";say("private",v)});
poll();setInterval(poll,900);
</script>
