<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty</title>
<link rel="stylesheet" href="/ui/kitty.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:var(--paper);padding:8px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;border-bottom:1px solid var(--rule)}
.logo{display:inline-flex;align-items:center;gap:9px;font-size:27px;font-weight:800;font-stretch:118%;letter-spacing:-.02em;line-height:1;text-decoration:none}
.logo svg{width:36px;height:32px;flex:none}
.top-right{display:flex;align-items:center;gap:14px}
.top a.back{font-weight:600;text-decoration:none}
.top a.back:hover{text-decoration:underline;text-underline-offset:3px}
main{flex:1;width:100%;max-width:1080px;margin:0 auto;padding:clamp(24px,4vw,48px) clamp(16px,4vw,40px) 72px}
main:focus{outline:0}

/* Wide screens have a margin to sit in, so the cat floats there. Anywhere narrower she stays in the header, on top of nothing. */
@media (min-width:1280px){
  body.hero-seen #catdock .kc-btn{visibility:hidden}
  #catdock{position:fixed;right:28px;bottom:24px;z-index:30}
  html.kp-open #catdock{visibility:hidden}
  #catdock .kc-btn kitty-cat{width:88px;height:88px}
}

/* First screen: words on the left. On the right, the three rooms, with the cat on top of them. */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:clamp(28px,5vw,64px);align-items:end}
.lede{font-size:clamp(18px,2vw,21px);line-height:1.45;max-width:32em;margin-top:16px;color:var(--ink-2)}
.cta{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.perch{--cat:clamp(132px,15vw,188px);position:relative;padding-top:calc(var(--cat)*.935)}
.hero-cat{position:absolute;top:0;right:clamp(20px,6vw,64px);width:var(--cat);height:var(--cat);z-index:1;padding:0;border:0;background:none;cursor:pointer;border-radius:var(--r-m);transition:transform .2s var(--ease)}
.hero-cat:hover{transform:translateY(-3px)}
.hero-cat kitty-cat{width:100%;height:100%}
.perch .kc-floor{display:none}
.rooms{display:grid;position:relative}
.room{padding:14px 18px;font-size:16px;line-height:1.35}
.room b{display:block;font-size:19px;font-weight:700;font-stretch:108%}
.room.you{background:var(--monsoon);color:var(--on-monsoon);border-radius:var(--r-m) var(--r-m) 0 0} .room.you b{color:var(--on-dark)}
.room.desk{background:var(--surface);margin:0 18px;box-shadow:var(--lift)}
.room.grp{background:var(--marigold);color:var(--on-accent);margin:0 36px;border-radius:0 0 var(--r-m) var(--r-m)}

/* Your trips: one list on the page, not a wall of boxes. */
.trips-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:clamp(40px,6vw,64px)}
.trips{margin-top:12px;border-top:1.5px solid var(--rule-strong)}
.trip-row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:4px 28px;padding:18px 4px;border-bottom:1.5px solid var(--rule);text-decoration:none;align-items:center;transition:background .14s}
.trip-row:hover{background:var(--sunk)}
.trip-row:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.trip-row b{font-size:22px;font-weight:700;font-stretch:108%;line-height:1.15;overflow-wrap:anywhere;display:block}
.trip-row small{color:var(--ink-2);font-size:15px;display:block;overflow-wrap:anywhere}
.trip-money{font-size:15px;min-width:0}
.trip-money .meter{margin-top:6px;max-width:320px}
.trip-money b{font-size:16px;display:inline;font-weight:650;font-stretch:100%}
.trip-pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.skeleton{display:block;height:12px;width:70%;max-width:240px;border-radius:999px;background:var(--sunk)}
.emptyline{padding:20px 4px;color:var(--ink-2);border-bottom:1.5px solid var(--rule)}
.how{margin-top:clamp(40px,6vw,64px)}
.how h2{margin-bottom:22px}

/* Making a trip: the form, and the chit it fills in. */
.make{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(24px,5vw,56px);align-items:start;margin-top:8px}
.side-chit{position:sticky;top:92px}
.trail-wrap{margin-bottom:24px}
form.stack{display:grid;gap:18px;margin-top:20px;max-width:30em}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.coins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px;border:0;padding:0}
.coins legend{font-weight:600;padding:0;margin-bottom:6px}
.coins label{position:relative;display:grid;place-items:center;min-height:64px;padding:8px 2px;border-radius:var(--r-s);box-shadow:inset 0 0 0 1.5px var(--rule-strong);cursor:pointer;background:var(--surface);font-weight:500;font-size:15px;line-height:1.2;text-align:center;transition:background .14s}
.coins label:hover{background:var(--sunk)}
.coins label b{font-size:22px;font-weight:700;line-height:1}
.coins input{position:absolute;opacity:0;inset:0;cursor:pointer}
.coins label:has(input:checked){background:var(--monsoon);color:var(--on-dark);box-shadow:none}
.coins label:has(input:focus-visible){outline:3px solid var(--monsoon-3);outline-offset:2px}
.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.addrow{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:start;margin-top:20px}
.addrow .btn{margin-top:30px;min-height:46px}
.chit h2{font-size:26px;overflow-wrap:anywhere}
.chit h2.blank{color:var(--ink-2);font-weight:500}
.chit .when{color:var(--ink-2);margin-top:2px}
.chit ul{list-style:none;padding:0;margin-top:14px;border-top:1.5px dashed var(--rule-strong)}
.chit li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1.5px dashed var(--rule-strong);overflow-wrap:anywhere}
.chit li b{font-size:18px;font-weight:650;line-height:1.2}
.chit li small{color:var(--ink-2);font-size:14px;display:block;font-weight:400}
.chit .empty{padding:14px 0 2px;color:var(--ink-2)}
.chit .tick{flex:none;font-weight:600;font-size:14px}
.chit .tick.ok{color:var(--good)}
.chit .tick.bad{color:var(--bad)}
.people-list{list-style:none;padding:0;margin-top:22px;max-width:34em}
.people-list li{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-top:1.5px solid var(--rule);overflow-wrap:anywhere}
.people-list li b{font-size:19px;font-weight:650}
.next{margin-top:14px;padding-left:20px;max-width:34em;color:var(--ink-2)}
.next li{padding:3px 0}

/* Shared Expenses or The Pot */
.kinds{border:0;padding:0;margin-top:26px;max-width:40em}
.kinds legend{font-size:20px;font-weight:700;font-stretch:108%;padding:0}
.kind-cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.kind{position:relative;display:block;padding:14px 16px 16px;border-radius:var(--r-m);background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--rule-strong);cursor:pointer;font-weight:400;line-height:1.35;transition:box-shadow .14s,background .14s}
.kind:hover{background:var(--sunk)}
.kind b{display:block;font-size:19px;font-weight:700;font-stretch:108%;margin-bottom:3px}
.kind input{position:absolute;opacity:0;inset:0;cursor:pointer}
.kind:has(input:checked){box-shadow:inset 0 0 0 2.5px var(--monsoon);background:var(--surface)}
.kind:has(input:focus-visible){outline:3px solid var(--monsoon-3);outline-offset:2px}
.kind .tickmark{position:absolute;top:12px;right:12px;width:22px;height:22px;display:none;place-items:center;border-radius:50%;background:var(--monsoon);color:#fff}
.kind:has(input:checked) .tickmark{display:grid}
#potExtra{display:grid;gap:12px;margin-top:14px;max-width:30em}

/* Setting up */
.build{margin-top:22px;max-width:36em}
.who{display:grid;grid-template-columns:minmax(70px,auto) 1fr;gap:4px 14px;padding:12px 0;border-top:1.5px solid var(--rule);align-items:center}
.who b{font-size:19px;font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.pips{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.pip{height:10px;border-radius:3px;background:var(--sunk)}
.pip.done{background:var(--good)}
.pip.running{background:var(--marigold);animation:breathe 1s ease-in-out infinite alternate}
.pip.failed{background:var(--bad)}
@keyframes breathe{from{opacity:.45}to{opacity:1}}
.who small{grid-column:2;color:var(--ink-2);font-size:15px}
.who small.bad{color:var(--bad);font-weight:500}
.tripwide{padding:6px 0;display:flex;gap:10px;align-items:baseline}
.dot{flex:none;width:10px;height:10px;border-radius:3px;background:var(--sunk);align-self:center;box-shadow:inset 0 0 0 1px var(--rule)}
.dot.done{background:var(--good)} .dot.running{background:var(--marigold);animation:breathe 1s ease-in-out infinite alternate} .dot.failed{background:var(--bad)}

/* An open trip */
.trip-head{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:end}
.trip-head h1{overflow-wrap:anywhere}
.trip-trail{margin-top:30px}
.sections{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:clamp(28px,5vw,56px);margin-top:36px;align-items:start}
.person{padding:14px 0;border-top:1.5px solid var(--rule);display:grid;grid-template-columns:42px 1fr;gap:0 12px}
.badge{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:19px;font-weight:700;grid-row:span 2;background:var(--sunk)}
.person.ready .badge{background:var(--monsoon);color:var(--on-dark)}
.person b{font-size:20px;font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.person .state{color:var(--ink-2);font-size:15.500px}
.person .do{grid-column:2;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center}
.pot-now{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;margin-top:12px}
.pot-now .figure{font-size:clamp(22px,2.6vw,30px)}
.pot-now .meter{grid-column:1/-1;margin:6px 0 4px}
.bar-row{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:10px;align-items:center;padding:7px 0}
.bar-row b{font-size:17px;font-weight:650;line-height:1.2;overflow-wrap:anywhere}
.track{position:relative;height:18px}
.track::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink-2)}
.fill{position:absolute;top:2px;height:14px;transition:width .5s var(--ease)}
.fill.owed{left:50%;background:var(--marigold);border-radius:0 4px 4px 0} .fill.owes{right:50%;background:var(--monsoon-2);border-radius:4px 0 0 4px}
.val{font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.plan{list-style:none;padding:0;margin-top:8px}
.plan li{padding:6px 0;border-top:1.5px solid var(--rule)}
.plan b{font-variant-numeric:tabular-nums}
.privacy-note{margin-top:30px;color:var(--ink-2);font-size:15px;max-width:44em}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:var(--r-s);font-weight:500;max-width:calc(100vw - 32px);z-index:40}
@media (max-width:860px){
  .hero,.make,.sections{grid-template-columns:1fr}
  .side-chit{position:relative;top:auto}
  .trip-row{grid-template-columns:minmax(0,1fr) auto}
  .trip-money{grid-column:1/-1;grid-row:2;margin-top:6px}
}
@media (max-width:520px){
  .addrow{grid-template-columns:1fr}.addrow .btn{margin-top:0}
  .room.desk{margin:0 10px}.room.grp{margin:0 20px}
  .kind-cards{grid-template-columns:1fr}
  .bar-row{grid-template-columns:minmax(58px,auto) 1fr}.val{grid-column:1/-1;text-align:left}
  .logo{font-size:24px}
}
@media (prefers-reduced-motion:reduce){.pip.running,.dot.running{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to the page</a>
<div class="top"><a class="logo" href="/" data-link aria-label="Kitty, your trips"><span id="mark"></span>Kitty</a><div class="top-right"><a class="back" href="/" data-link id="backlink" hidden>Your trips</a><div id="catdock"></div></div></div>
<main id="main" tabindex="-1"></main>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/ui/icons.js"></script>
<script src="/ui/cat.js"></script>
<script src="/ui/companion.js"></script>
<script src="/ui/guide.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dm=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
const dmy=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const SYMBOL={INR:"₹",USD:"$",EUR:"€",GBP:"£"},COINS={INR:"Rupee",USD:"Dollar",EUR:"Euro",GBP:"Pound"};
const money=(p,c)=>{const n=Math.abs(p),w=Math.floor(n/100),f=String(n%100).padStart(2,"0");return (p<0?"-":"")+SYMBOL[c]+w.toLocaleString(c==="INR"?"en-IN":"en-US")+"."+f};
const STATE={idle:"Not opened yet",running:"Setting up",failed:"Needs a retry",live:"Open"};
const {guide,companion}=Kitty;
let view={name:"home"},timer=null,lastDraw="",errors={},form={},personForm={},seenStep={},heroWatch=null;
$("mark").innerHTML=Kitty.MARK;
companion.mount({dock:"#catdock"});

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:opts.body?{"Content-Type":"application/json"}:{},body:opts.body?JSON.stringify(opts.body):undefined});
  let body={};try{body=await r.json()}catch(e){}
  return {ok:r.ok,status:r.status,body};
}
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2600)}
function go(path,replace){history[replace?"replaceState":"pushState"]({}, "",path);route()}
function route(){
  clearInterval(timer);lastDraw="";errors={};
  document.body.classList.remove("hero-seen");heroWatch&&heroWatch.disconnect();
  const m=location.pathname.match(/^\/trips\/([a-z0-9-]+)$/);
  $("backlink").hidden=location.pathname==="/";
  if(location.pathname==="/trips/new"){view={name:"new"};form={currency:"INR",create_key:crypto.randomUUID()};drawNew()}
  else if(m){view={name:"trip",id:m[1]};loadTrip();timer=setInterval(loadTrip,1200)}
  else{view={name:"home"};loadHome()}
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{const a=e.target.closest("[data-link]");if(a){e.preventDefault();go(a.getAttribute("href"))}});
window.addEventListener("popstate",route);

/* ---- first screen ---- */
async function loadHome(){
  const {ok,body}=await api("/api/trips");const trips=body.trips||[];
  if(view.name!=="home")return;
  $("main").innerHTML=`
    <section class="hero">
      <div>
        <h1>Settle up a trip. Keep your bank statement to yourself.</h1>
        <p class="lede">Everyone's own agent reads their own statement. The group sees only the expenses each person chooses to release, and Kitty works out who owes whom.</p>
        <div class="cta"><a class="btn" href="/trips/new" data-link>Start a trip</a><a class="btn quiet" href="#how" id="howLink">See how it works</a></div>
      </div>
      <div class="perch">
        <button class="hero-cat" id="heroBtn" type="button" aria-label="Ask Kitty"><kitty-cat id="heroCat" mood="greeting"></kitty-cat></button>
        <div class="rooms" aria-label="How Kitty keeps things apart">
          <div class="room you"><b>Just you</b>Your statement and your agent. Nobody else gets in.</div>
          <div class="room desk"><b>Your desk</b>What your agent found, waiting for you to release or drop it.</div>
          <div class="room grp"><b>The group</b>Date, amount, category, who shared it. No merchant names.</div>
        </div>
      </div>
    </section>
    ${!ok?`<div class="banner" role="alert"><b>Kitty couldn't load your trips.</b>Check that the home app is still running, then reload this page.</div>`:""}
    <section aria-labelledby="yt"><div class="trips-head"><h2 id="yt">Your trips</h2></div>
      <div class="trips">${trips.length?trips.map(tripRow).join(""):`<p class="emptyline">No trips yet. Start one, and I'll walk you through it.</p>`}</div></section>
    <section class="how" id="how" aria-labelledby="hw"><h2 id="hw">How a trip goes</h2>${guide.trail(-1,{0:"Name and dates",1:"Everyone gets a private app",2:"Each person releases their own",3:"Whoever received it says so",4:"The fewest payments that clear it"})}</section>`;
  setTimeout(()=>{const c=$("heroCat");if(c)c.rest("idle")},2600);
  $("heroBtn").onclick=()=>companion.open();
  heroWatch&&heroWatch.disconnect();
  heroWatch=new IntersectionObserver(([e])=>document.body.classList.toggle("hero-seen",e.isIntersecting));
  heroWatch.observe($("heroBtn"));
  $("howLink").onclick=e=>{e.preventDefault();companion.point("#how")};
  companion.set(guide.home(trips,go));
  trips.forEach(fillTrip);
}
const whenRange=t=>`${dm(t.start)} to ${dm(t.end)}`;
function tripRow(t){
  return `<a class="trip-row" href="/trips/${esc(t.id)}" data-link><span><b>${esc(t.name)}</b><small>${whenRange(t)}. ${t.people.length?esc(t.people.join(", ")):"Nobody added yet"}.</small></span>
    <span class="trip-money" data-money="${esc(t.id)}">${t.state==="live"?`<i class="skeleton" role="img" aria-label="Loading figures"></i>`:""}</span>
    <span class="trip-pills" data-pills="${esc(t.id)}"><span class="pill ${t.state==="failed"?"bad":t.state==="live"?"":"wait"}">${STATE[t.state]||""}</span></span></a>`;
}
/* Figures on a trip row come from that trip's own board, through the same route its page uses. */
async function fillTrip(s){
  const r=await api(`/api/trips/${s.id}`);if(!r.ok||view.name!=="home")return;
  const t=r.body,cell=document.querySelector(`[data-money="${s.id}"]`),pills=document.querySelector(`[data-pills="${s.id}"]`);
  if(!cell)return;
  // Until a trip opens, no treasurer only means nobody's chosen yet.
  const kind=t.treasurer?`<span class="pill pot">The Pot</span>`:t.state==="idle"?"":`<span class="pill shared">Shared expenses</span>`;
  pills.insertAdjacentHTML("afterbegin",kind);
  if(t.state!=="live"){cell.innerHTML="";return}
  if(!t.apps_up||!t.board){cell.innerHTML=`<span class="muted">This trip's apps aren't running.</span>`;return}
  const b=t.board,c=b.trip.currency||t.currency;
  if(b.pot){
    const x=guide.potTotals(b.pot);
    cell.innerHTML=b.pot.square?`<b>Everyone's square.</b>`:x.asked?`<b class="tabular">${money(x.credited,c)}</b> of ${money(x.asked,c)} confirmed<div class="meter" role="img" aria-label="${Math.round(x.credited/x.asked*100)} percent confirmed"><i style="width:${Math.min(100,x.credited/x.asked*100)}%"></i></div>`:`<span class="muted">Nobody's been asked for money yet.</span>`;
  }else{
    const n=b.expenses.filter(e=>e.status==="released").length,square=n&&b.balances.every(x=>x.paise===0);
    cell.innerHTML=square?`<b>Everyone's square.</b>`:n?`<b>${n} expense${n===1?"":"s"} counted.</b> ${b.plan.length} payment${b.plan.length===1?"":"s"} left to settle it.`:`<span class="muted">Nothing counted yet.</span>`;
  }
}

/* ---- the chit ---- */
function chit(t,opts={}){
  const people=t.people||[];const c=t.currency;
  return `<aside class="side-chit" aria-label="This trip so far"><div class="chit">
    <h2 class="${t.name?"":"blank"}">${esc(t.name||"Your trip")}</h2>
    <p class="when">${t.start?`${dmy(t.start)}${t.end?` to ${dmy(t.end)}`:""}`:"Dates to come"}${c?`. ${esc(COINS[c]||c)}s (${SYMBOL[c]||""}).`:""}</p>
    ${people.length?`<ul>${people.map(p=>`<li><span><b>${esc(p.name)}</b><small>${esc(p.statement_name||"")}</small></span>${opts.ticks?tick(p):""}</li>`).join("")}</ul>`:`<p class="empty">Nobody here yet.</p>`}
  </div></aside>`;
}
function tick(p){
  if(p.failed) return `<span class="tick bad">Stuck</span>`;
  if(p.steps_total&&p.steps_done===p.steps_total) return `<span class="tick ok">Ready</span>`;
  return p.steps_done?`<span class="tick muted">${p.steps_done} of ${p.steps_total}</span>`:"";
}
const stepsNav=(n,mood)=>`<div class="trail-wrap">${guide.trail(n,{mood})}</div>`;
const fieldError=k=>errors[k]?`<span class="field-error" id="err-${k}">${esc(errors[k])}</span>`:"";
const invalid=k=>errors[k]?`aria-invalid="true" aria-describedby="err-${k}"`:"";

/* ---- step 1 ---- */
function drawNew(){
  $("main").innerHTML=`${stepsNav(0,"guiding")}<div class="make"><div><h1 class="step">Where did you all go?</h1>
    <form class="stack" id="tripForm" novalidate>
      <label>Trip name<input type="text" name="name" maxlength="40" value="${esc(form.name)}" autocomplete="off" placeholder="Coorg long weekend" ${invalid("name")}>${fieldError("name")}</label>
      <div class="two"><label>First day<input type="date" name="start" value="${esc(form.start)}" ${invalid("start")}>${fieldError("start")}</label><label>Last day<input type="date" name="end" value="${esc(form.end)}" ${invalid("end")}>${fieldError("end")}</label></div>
      <fieldset class="coins"><legend>Currency everyone paid in</legend>${Object.keys(SYMBOL).map(c=>`<label><input type="radio" name="currency" value="${c}" ${form.currency===c?"checked":""}><b>${SYMBOL[c]}</b>${c}</label>`).join("")}</fieldset>${fieldError("currency")}
      <p class="hint">Kitty doesn't convert currencies, so everyone's statement needs to be in this one.</p>
      <div class="actions"><button class="btn">Continue to people</button><a class="btn quiet" href="/" data-link>Cancel</a></div>
    </form></div>${chit(form)}</div>`;
  const f=$("tripForm");
  f.addEventListener("input",()=>{const d=new FormData(f);form={...form,name:d.get("name"),start:d.get("start"),end:d.get("end"),currency:d.get("currency")};const c=document.querySelector(".side-chit");c.outerHTML=chit(form)});
  f.addEventListener("submit",async e=>{e.preventDefault();const r=await api("/api/trips",{method:"POST",body:form});
    if(r.ok){go(`/trips/${r.body.id}`)}else{errors=r.body.fields||{};if(!r.body.fields)toast(r.body.error||"Couldn't save that. Try again.");drawNew();document.querySelector("[aria-invalid=true]")?.focus()}});
  f.querySelector("input").focus();
  companion.set(guide.newTrip());
}

/* ---- a trip, whatever state it's in ---- */
async function loadTrip(){
  const id=view.id;
  const r=await api(`/api/trips/${id}`);
  if(view.id!==id) return;
  if(!r.ok){clearInterval(timer);$("main").innerHTML=`<h1 class="step">There's no such trip.</h1><div class="cta"><a class="btn" href="/" data-link>See your trips</a></div>`;companion.set({id:"gone",title:"That trip isn't here",mood:"curious",say:"I can't find that trip. It may have been deleted before it opened.",actions:[]});return}
  const s=JSON.stringify(r.body)+JSON.stringify(errors);
  if(s===lastDraw) return;
  // Don't redraw over someone who's typing.
  if(document.activeElement&&document.activeElement.matches("input[type=text]")&&lastDraw&&r.body.state!=="running"&&view.step!=="review"){return}
  lastDraw=s;drawTrip(r.body);
}
function drawTrip(t){
  if(t.state==="idle"&&view.step!=="review") return drawPeople(t);
  if(t.state==="idle") return drawReview(t);
  if(t.state==="live") return drawLive(t);
  return drawBuilding(t);
}

/* ---- step 2 ---- */
function drawPeople(t){
  const n=t.people.length;
  $("main").innerHTML=`${stepsNav(1,"guiding")}<div class="make"><div><h1 class="step">Who was on the trip?</h1>
    <p class="muted" style="margin-top:8px">Each person gets their own private agent and rooms. Add ${n<t.limits.min?`at least ${t.limits.min}`:`up to ${t.limits.max}`}.</p>
    <form id="personForm" novalidate><div class="addrow">
      <label>Name the group sees<input type="text" name="name" maxlength="14" autocomplete="off" value="${esc(personForm.name)}" placeholder="Asha" ${invalid("name")}>${fieldError("name")}</label>
      <label>Name on their payments<input type="text" name="statement_name" maxlength="30" autocomplete="off" value="${esc(personForm.statement_name)}" placeholder="ASHA M" ${invalid("statement_name")}>${fieldError("statement_name")}</label>
      <button class="btn dark">Add</button></div>
      <p class="hint" style="margin-top:6px">Kitty uses the second name to spot payments between friends, like UPI/DR/ASHA M. Leave it empty to use the first name.</p></form>
    ${n?`<ul class="people-list">${t.people.map(p=>`<li><span><b>${esc(p.name)}</b> <span class="muted">${esc(p.statement_name)}</span></span><button class="linkish" data-remove="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">Remove</button></li>`).join("")}</ul>`:""}
    <div class="actions"><button class="btn" id="toReview" ${n<t.limits.min?"disabled":""}>Continue</button><button class="btn quiet" id="deleteTrip">Delete this trip</button></div>
    </div>${chit(t)}</div>`;
  const f=$("personForm");
  f.addEventListener("input",()=>{const d=new FormData(f);personForm={name:d.get("name"),statement_name:d.get("statement_name")}});
  f.addEventListener("submit",async e=>{e.preventDefault();const btn=f.querySelector("button[type=submit],button:not([type])");if(btn?.disabled)return;if(btn)btn.disabled=true;let r;try{r=await api(`/api/trips/${t.id}/people`,{method:"POST",body:personForm})}finally{if(btn)btn.disabled=false}
    if(r.ok){personForm={};errors={};drawPeople(r.body);lastDraw=JSON.stringify(r.body)+"{}";document.querySelector("#personForm input").focus()}
    else{errors=r.body.fields||{};if(!r.body.fields)toast(r.body.error||"Couldn't add them. Try again.");drawPeople(t);document.querySelector("[aria-invalid=true]")?.focus()}});
  $("toReview").onclick=()=>{view.step="review";lastDraw="";drawReview(t)};
  $("deleteTrip").onclick=async()=>{if(!confirm(`Delete ${t.name}? This can't be undone.`))return;await api(`/api/trips/${t.id}`,{method:"DELETE"});go("/")};
  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=async()=>{const r=await api(`/api/trips/${t.id}/people/${b.dataset.remove}`,{method:"DELETE"});if(r.ok){drawPeople(r.body);lastDraw=""}});
  companion.set(guide.people(t));
}

/* ---- step 3 ---- */
let potChoice={};
function drawReview(t){
  const chosen=potChoice[t.id]||(potChoice[t.id]={});
  let gone=t.pot_cleared||null;
  if(chosen.treasurer&&!t.people.some(p=>p.id===chosen.treasurer)){gone=chosen.treasurer[0].toUpperCase()+chosen.treasurer.slice(1);delete chosen.treasurer}
  const pot={treasurer:chosen.treasurer??t.treasurer??"",collect_from:chosen.collect_from??t.collect_from??""};
  if(!chosen.kind)chosen.kind=pot.treasurer?"pot":"shared";
  $("main").innerHTML=`${stepsNav(1,"curious")}<div class="make"><div><h1 class="step">Ready to open ${esc(t.name)}?</h1>
    <fieldset class="kinds"><legend>Who holds the group's money?</legend>
      ${gone&&!pot.treasurer?`<p class="hint" role="alert">${esc(gone)} was holding the money and has been removed. Choose someone else, or leave it on Nobody.</p>`:""}
      <div class="kind-cards">
        <label class="kind"><input type="radio" name="kind" value="shared" ${chosen.kind==="shared"?"checked":""}><span class="tickmark">${Kitty.icon("check",14)}</span><b>Shared expenses</b>Nobody, everyone pays and we settle up.</label>
        <label class="kind"><input type="radio" name="kind" value="pot" ${chosen.kind==="pot"?"checked":""}><span class="tickmark">${Kitty.icon("check",14)}</span><b>The Pot</b>Everyone pays them, and only they can confirm money arrived.</label>
      </div>
      <div id="potExtra" ${chosen.kind==="pot"?"":"hidden"}>
        <label>Who holds it?<select id="treasurer"><option value="">Choose someone</option>${t.people.map(p=>`<option value="${esc(p.id)}" ${pot.treasurer===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><span class="field-error" id="potProblem" role="alert" hidden></span></label>
        <label>People can start paying in from<input type="date" id="collectFrom" value="${esc(pot.collect_from||t.start)}" max="${esc(t.start)}"></label>
        <p class="hint" role="note">Whoever runs this Kitty server can read every room, including private ones. If that's the person holding the money, the others have only their word that they aren't reading.</p>
      </div></fieldset>
    <h2 style="margin-top:28px;font-size:20px">When you open it</h2>
    <ul class="next"><li>Kitty makes ${t.people.length} separate accounts, each with its own private agent, private room and desk.</li>
    <li>You get one invite link per person. Each link opens once, and only that person's own app.</li>
    <li>Everyone adds their own made-up statement. You won't see any of it.</li>
    <li>Once the group room opens, this trip's people and dates are fixed.</li></ul>
    <div class="actions"><button class="btn" id="openTrip">Open the trip</button><button class="btn quiet" id="backPeople">Back to people</button></div></div>${chit(t)}</div>`;
  $("backPeople").onclick=()=>{view.step="";lastDraw="";drawPeople(t)};
  document.querySelectorAll("input[name=kind]").forEach(r=>r.onchange=()=>{chosen.kind=r.value;$("potExtra").hidden=r.value!=="pot";if(r.value==="shared"){$("treasurer").value="";chosen.treasurer=""}});
  $("treasurer").onchange=e=>{potChoice[t.id].treasurer=e.target.value;$("potProblem").hidden=true};
  $("collectFrom").onchange=e=>{potChoice[t.id].collect_from=e.target.value};
  $("openTrip").onclick=async e=>{
    const who=chosen.kind==="pot"?$("treasurer").value:"";
    if(chosen.kind==="pot"&&!who){const p=$("potProblem");p.textContent="Choose who holds the money, or switch to Shared expenses.";p.hidden=false;$("treasurer").focus();return}
    e.target.disabled=true;e.target.textContent="Opening";
    const saved=await api(`/api/trips/${t.id}/pot`,{method:"PUT",body:who?{treasurer:who,collect_from:$("collectFrom").value}:{}});
    if(!saved.ok){toast(Object.values(saved.body.fields||{})[0]||saved.body.error||"Couldn't save that. Try again.");e.target.disabled=false;e.target.textContent="Open the trip";return}
    const r=await api(`/api/trips/${t.id}/open`,{method:"POST"});
    if(!r.ok&&r.status!==409){toast(r.body.error||"Couldn't open the trip. Try again.");e.target.disabled=false;e.target.textContent="Open the trip";return}
    view.step="";lastDraw="";loadTrip()};
  companion.set(guide.review(t));
}

/* ---- setting up, and when it sticks ---- */
function drawBuilding(t){
  const steps=t.provision.steps,failed=steps.filter(s=>s.state==="failed");
  const wide=steps.filter(s=>!s.person);
  const row=p=>{const mine=steps.filter(s=>s.person===p.id),cur=mine.find(s=>["running","failed"].includes(s.state));
    return `<div class="who"><b>${esc(p.name)}</b><div class="pips" role="img" aria-label="${p.steps_done} of ${p.steps_total} steps done">${mine.map(s=>`<i class="pip ${s.state}"></i>`).join("")}</div><small class="${cur&&cur.state==="failed"?"bad":""}">${cur?(cur.state==="failed"?"Stopped at: ":"")+esc(cur.label):p.steps_done===p.steps_total?"Ready":"Waiting"}</small>
    ${p.failed&&t.editable?`<small style="grid-column:2"><button class="linkish" data-remove="${esc(p.id)}">Remove ${esc(p.name)} from the trip</button></small>`:""}</div>`};
  const before=wide.filter(s=>["connect","clerk"].includes(s.id)),after=wide.filter(s=>!["connect","clerk"].includes(s.id));
  const line=s=>`<div class="tripwide"><i class="dot ${s.state}"></i><span>${esc(s.label)}</span></div>`;
  const unique=[...new Set(failed.map(s=>s.error.message))];
  const isFailed=t.state==="failed";
  $("main").innerHTML=`${stepsNav(1,isFailed?"warning":"thinking")}<div class="make"><div>
    <h1 class="step">${isFailed?"Set-up stopped partway.":`Opening ${esc(t.name)}.`}</h1>
    <p class="muted" style="margin-top:8px">${isFailed?"What's already built is safe, and trying again carries on from here.":"This usually takes about a minute. You can leave this page, and it keeps going."}</p>
    ${isFailed?`<div class="banner" role="alert">${unique.map(m=>`<b>${esc(m)}</b>`).join("")}</div><div class="actions"><button class="btn" id="retry" ${t.running?"disabled":""}>Try again</button></div>`:""}
    <div class="build">${before.map(line).join("")}${t.people.map(row).join("")}<div style="border-top:1.5px solid var(--rule);padding-top:6px">${after.map(line).join("")}</div></div>
    </div>${chit(t,{ticks:true})}</div>`;
  const b=$("retry");if(b)b.onclick=async()=>{b.disabled=true;await api(`/api/trips/${t.id}/open`,{method:"POST"});lastDraw="";loadTrip()};
  document.querySelectorAll("[data-remove]").forEach(x=>x.onclick=async()=>{const r=await api(`/api/trips/${t.id}/people/${x.dataset.remove}`,{method:"DELETE"});if(!r.ok)toast(r.body.error||"Couldn't remove them.");lastDraw="";loadTrip()});
  companion.set(guide.building(t));
}

/* ---- an open trip ---- */
function statusLine(p){
  if(p.statement_added) return "Joined, and added a statement.";
  if(p.joined) return "Joined. No statement yet.";
  return "Hasn't opened their invite yet.";
}
function board(t){
  const b=t.board;
  if(!t.apps_up) return `<div class="banner" role="alert"><b>This trip's apps aren't running.</b>Start them again, and everyone carries on from where they were.</div><div class="actions"><button class="btn" id="restart">Start the apps</button></div>`;
  if(!b) return `<p class="muted" style="margin-top:8px">The board isn't answering yet.</p>`;
  const counted=b.expenses.filter(e=>e.status==="released").length,c=b.trip.currency||t.currency;
  const max=Math.max(1,...b.balances.map(x=>Math.abs(x.paise)));
  const square=counted&&b.balances.every(x=>x.paise===0);
  let pot="";
  if(b.pot){const x=guide.potTotals(b.pot);pot=x.asked?`<div class="pot-now"><span class="small muted">Confirmed</span><span class="small muted">Still to come</span><span class="figure">${money(x.credited,c)}</span><span class="figure">${money(x.outstanding,c)}</span><div class="meter" role="img" aria-label="${Math.round(x.credited/x.asked*100)} percent of ${money(x.asked,c)} confirmed"><i style="width:${Math.min(100,x.credited/x.asked*100)}%"></i></div><span class="small muted" style="grid-column:1/-1">Of ${money(x.asked,c)} asked for.</span></div>`:""}
  return `${pot}<p class="muted" style="margin-top:8px">${square?"Everyone's square.":counted?`${counted} expense${counted===1?"":"s"} counted so far.`:"Nothing counted yet. Expenses appear once their owners release them."}</p>
    <div style="margin-top:10px">${b.balances.map(x=>{const w=Math.abs(x.paise)/max*48;return `<div class="bar-row"><b>${esc(x.name)}</b><div class="track"><i class="fill ${x.paise<0?"owes":"owed"}" style="width:${w}%"></i></div><span class="val">${counted?(x.paise===0?"square":`${money(Math.abs(x.paise),c)} ${x.paise<0?"owes":"is owed"}`):""}</span></div>`}).join("")}</div>
    ${b.plan.length?`<h3 style="margin-top:18px">Payments that would settle it</h3><ul class="plan">${b.plan.map(p=>`<li>${esc(p.from)} pays ${esc(p.to)} <b>${money(p.paise,c)}</b></li>`).join("")}</ul>`:""}
    <div class="actions"><a class="btn quiet small" href="${esc(t.board_url)}" target="_blank" rel="noopener">Open the full trip board</a></div>`;
}
function drawLive(t){
  const ready=t.people.filter(p=>p.statement_added).length,step=guide.tripStep(t);
  const ctx=guide.live(t,money);
  $("main").innerHTML=`<div class="trip-head"><div><h1>${esc(t.name)}</h1><p class="muted" style="margin-top:6px"><span class="pill ${t.treasurer?"pot":"shared"}" style="margin-right:8px">${t.treasurer?"The Pot":"Shared expenses"}</span>${dmy(t.start)} to ${dmy(t.end)}. ${ready} of ${t.people.length} statements added.</p></div></div>
    <div class="trip-trail">${guide.trail(step,{mood:ctx.mood})}</div>
    <div class="sections"><section aria-labelledby="ppl"><h2 id="ppl">Who's in</h2><p class="muted" style="margin:2px 0 10px">Send each person their own link. It opens once, and only their app.</p>
    ${t.people.map(p=>`<div class="person ${p.statement_added?"ready":""}"><span class="badge" aria-hidden="true">${esc(p.name[0])}</span><b>${esc(p.name)}</b><span class="state">${statusLine(p)}</span>
      <div class="do">${p.invite_url?`<button class="btn small" data-copy="${esc(p.invite_url)}" data-who="${esc(p.name)}">${Kitty.icon("copy",16)}Copy ${esc(p.name)}'s link</button><a class="btn small quiet" href="${esc(p.invite_url)}" target="_blank" rel="noopener">Open as ${esc(p.name)}</a>`:""}${p.app_url?`<a class="btn small quiet" href="${esc(p.app_url)}" target="_blank" rel="noopener">Open ${esc(p.name)}'s app</a>`:""}${p.joined&&t.apps_up?`<button class="linkish" style="font-size:15px" data-invite="${esc(p.id)}">Make a new link</button>`:""}</div></div>`).join("")}
    </section><section aria-labelledby="st"><h2 id="st">Where everyone stands</h2>${board(t)}</section></div>
    <p class="privacy-note">You can see who has joined and who has added a statement. You can't see what's in anyone's statement. Opening someone's app on this laptop uses their one-time link, so they'd find it already used. All data here is made up.</p>`;
  document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);toast(`${b.dataset.who}'s link copied.`)}catch(e){prompt("Copy this link:",b.dataset.copy)}});
  document.querySelectorAll("[data-invite]").forEach(b=>b.onclick=async()=>{if(!confirm("Make a new link? The old link and any open session stop working."))return;const r=await api(`/api/trips/${t.id}/people/${b.dataset.invite}/invite`,{method:"POST"});if(r.ok){toast("New link made.");lastDraw="";drawLive(r.body)}});
  const rs=$("restart");if(rs)rs.onclick=async()=>{rs.disabled=true;rs.textContent="Starting";await api(`/api/trips/${t.id}/restart`,{method:"POST"});lastDraw="";loadTrip()};
  // A moment only for a change seen on this page, never for what was already true when it loaded.
  if(seenStep[t.id]!==undefined&&step>seenStep[t.id]){if(step===5){companion.moment("celebrating",3200);Kitty.petals()}else companion.moment("paid",1800)}
  seenStep[t.id]=step;
  companion.set(ctx);
}
route();
</script>
</body>
</html>
